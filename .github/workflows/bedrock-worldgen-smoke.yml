name: Bedrock worldgen smoke
on:
  push:
    branches: [experiment/custom-models-safe-worldgen]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-seed:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - name: Test probe logic
        run: node --test test/companion/oak-worldgen.test.mjs
      - name: Fetch official Bedrock Dedicated Server 26.50
        run: |
          curl --fail --location --retry 2 --max-time 100 -A 'Mozilla/5.0' \
            https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.50.5.zip \
            -o "$RUNNER_TEMP/bds.zip"
          unzip -q "$RUNNER_TEMP/bds.zip" -d "$RUNNER_TEMP/j2b-bds"
      - name: Compare direct custom placement with same-seed vanilla
        run: |
          node test/companion/write-bds-fixture.mjs "$RUNNER_TEMP/j2b-bds"
          python3 test/companion/run-bds-comparison.py "$RUNNER_TEMP/j2b-bds"
