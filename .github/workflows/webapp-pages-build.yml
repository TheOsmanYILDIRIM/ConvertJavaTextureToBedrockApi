name: Build fork webapp Pages bundle

on:
  push:
    branches:
      - feature/java26-3-full-conversion
  workflow_dispatch:

concurrency:
  group: fork-webapp-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@v4

      - name: Checkout fork web app
        uses: actions/checkout@v4
        with:
          repository: TheOsmanYILDIRIM/ConvertJavaTextureToBedrock
          ref: main
          path: web
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pin web bundle to the checked-out API commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require("node:fs");
          const file = "web/package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          const name = "@modifiedcommand/convert-minecraft-java-texture-to-bedrock-api";
          const sha = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(sha) || !pkg.devDependencies?.[name]) {
            throw new Error("Cannot pin Pages build to its API commit");
          }
          pkg.devDependencies[name] = "github:TheOsmanYILDIRIM/ConvertJavaTextureToBedrockApi#" + sha;
          pkg.version = pkg.version.split("+")[0] + "+api." + sha.slice(0, 8);
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Install dependencies
        working-directory: web
        run: yarn install --ignore-engines

      - name: Verify installed API matches this checkout
        run: |
          diff -qr src web/node_modules/@modifiedcommand/convert-minecraft-java-texture-to-bedrock-api/src

      - name: Build
        working-directory: web
        continue-on-error: true
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: yarn build

      - name: Verify emitted bundle
        run: |
          test -f web/build/index.html
          grep -q "Java 26.3 conversions enabled" web/build/index.html
          grep -Fq "+api.${GITHUB_SHA:0:8}" web/build/index.html
          worker_count="$(find web/build -maxdepth 1 -name 'worker.*.js' | wc -l)"
          test "$worker_count" -ge 1
          grep -R -q "Custom Java block models detected" web/build/worker.*.js
          grep -R -q "j2b_companion/blocks/" web/build/worker.*.js
          grep -R -q "Nonstandard pack.mcmeta" web/build/worker.*.js
          echo "Verified Pages worker and visible API revision: $GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-pages-build
          path: web/build
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified GitHub Pages artifact
        if: github.ref == 'refs/heads/feature/java26-3-full-conversion'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    if: github.ref == 'refs/heads/feature/java26-3-full-conversion'
    needs: build-webapp
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Publish verified artifact to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision and converter worker
        env:
          PAGES_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_URL%/}/"
          expected="+api.${GITHUB_SHA:0:8}"
          for attempt in {1..18}; do
            if curl -fsSL --max-time 15 -o /tmp/pages.html "${url}?revision=${GITHUB_SHA}&attempt=${attempt}" &&
               grep -Fq -- "$expected" /tmp/pages.html; then
              while IFS= read -r script; do
                if ! curl -fsSL --max-time 15 -o /tmp/pages-main.js "${url}${script}"; then continue; fi
                while IFS= read -r worker; do
                  if curl -fsSL --max-time 30 -o /tmp/pages-worker.js "${url}${worker}" &&
                     grep -Fq "Nonstandard pack.mcmeta" /tmp/pages-worker.js; then
                    echo "Live Pages verified: ${url} (${expected})"
                    exit 0
                  fi
                done < <(grep -oE 'worker\.[a-f0-9]+\.js' /tmp/pages-main.js | sort -u)
              done < <(grep -oE 'index\.[a-f0-9]+\.js' /tmp/pages.html | sort -u)
            fi
            echo "Attempt ${attempt}: expected revision or converter worker not live yet"
            sleep 5
          done
          echo "::error::GitHub Pages did not serve the expected revision and worker: ${expected} at ${url}"
          exit 1
