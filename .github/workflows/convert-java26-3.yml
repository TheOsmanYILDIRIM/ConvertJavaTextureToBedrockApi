name: Convert Java 26.3 vanilla textures
on:
  push:
    branches:
      - feature/java26-3-full-conversion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Java 26.3 assets
        uses: actions/checkout@v4
        with:
          repository: InventivetalentDev/minecraft-assets
          ref: aaf3b3dbdf72b5723861324984813f3fd87db179
          path: java-vanilla
          sparse-checkout: |
            assets/minecraft/textures
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout pinned Bedrock reference textures
        uses: actions/checkout@v4
        with:
          repository: Mojang/bedrock-samples
          ref: 15701fa9c13923f12662984c32c124327e40e3d3
          path: bedrock-vanilla
          sparse-checkout: |
            resource_pack/textures/entity
            resource_pack/textures/blocks
            resource_pack/textures/items
            resource_pack/textures/particle
            resource_pack/textures/environment
            resource_pack/textures/colormap
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --omit=dev --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<13'
      - name: Check JavaScript
        run: find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Prepare vanilla Java ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import json
          origin=Path("java-vanilla/assets/minecraft/textures")
          images=sorted(origin.rglob("*.png"))
          assert len(images)>3500, len(images)
          Path("build").mkdir(exist_ok=True)
          with ZipFile("build/java_26_3_vanilla.zip","w",ZIP_DEFLATED,compresslevel=4) as z:
              z.writestr("pack.mcmeta",json.dumps({"pack":{"description":"Java 26.3 vanilla conversion test","min_format":97.1,"max_format":97.1}}))
              for f in images:z.write(f,str(Path("assets/minecraft/textures")/f.relative_to(origin)))
          print("Java source PNGs",len(images))
          PY
      - name: Convert texture pack with fork engine
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/convert-26-3.mjs build/java_26_3_vanilla.zip build/java26_3-to-bedrock1_26_50_4.mcpack >build/conversion.log 2>&1 || { tail -n 150 build/conversion.log; exit 1; }
      - name: Prepare OptiFine random block variation fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          from PIL import Image
          from io import BytesIO
          import json
          Path("build").mkdir(exist_ok=True)
          def png(color):
              im=Image.new("RGBA",(32,32),color)
              b=BytesIO(); im.save(b,format="PNG"); return b.getvalue()
          with ZipFile("build/optifine_random_fixture.zip","w",ZIP_DEFLATED) as z:
              z.writestr("pack.mcmeta",json.dumps({"pack":{"description":"OptiFine random native variation fixture","min_format":[97,1],"max_format":[97,1]}}))
              z.writestr("assets/minecraft/textures/block/gravel.png",png((100,100,100,255)))
              z.writestr("assets/minecraft/optifine/ctm/gravel/gravel.properties","method=random\nmatchTiles=gravel\nweight=100\ntiles=0 1 <default>\nweights=5 2 1\n")
              z.writestr("assets/minecraft/optifine/ctm/gravel/0.png",png((255,0,0,255)))
              z.writestr("assets/minecraft/optifine/ctm/gravel/1.png",png((0,255,0,255)))
              p="assets/minecraft/optifine/ctm/"
              t="assets/minecraft/textures/block/"
              z.writestr(t+"grass_block_top.png",png((255,0,255,255)))
              z.writestr(p+"patrix/grass/grass_block_2.properties","tiles=1-36\nmethod=repeat\nwidth=6\nheight=6\nmatchTiles=grass_block_top\n")
              for n in range(1,37):
                  im=Image.new("RGBA",(32,32),(1,180,20,255))
                  im.putpixel((16,16),(n,180,20,255))
                  b=BytesIO(); im.save(b,format="PNG")
                  z.writestr(p+f"patrix/grass/{n}.png",b.getvalue())
              z.writestr(p+"patrix/grass/snow.properties","method=repeat\nweight=900\nwidth=1\nheight=1\nmatchTiles=grass_block_top\nmatchBlocks=minecraft:grass_block:snowy=true\ntiles=optifine/ctm/patrix/grass/snow.png\n")
              z.writestr(p+"patrix/grass/snow.png",png((255,255,255,255)))
              z.writestr(t+"glass.png",png((255,0,0,255)))
              z.writestr(p+"glass/02_overlay.properties","method=overlay_random\nmatchTiles=glass\ntiles=blue clear\nweights=3 2\n")
              z.writestr(p+"glass/blue.png",png((0,0,255,128)))
              z.writestr(p+"glass/clear.png",png((0,0,0,0)))
              z.writestr(p+"glass/01_fixed.properties","method=fixed\nmatchTiles=glass\ntiles=optifine/ctm/glass/base.png\n")
              z.writestr(p+"glass/base.png",png((255,0,0,255)))
              z.writestr(p+"glass/00_dependent.properties","method=fixed\nmatchTiles=./base.png\ntiles=final\n")
              z.writestr(p+"glass/final.png",png((0,255,0,255)))
              z.writestr(p+"glass/03_second.properties","method=overlay_fixed\nmatchTiles=glass\ntiles=clear\n")
              z.writestr(p+"material/m.properties","method=random\nmatchTiles=diamond_block\ntiles=one two\nweights=2 3\n")
              for name in ("one","two"):
                  z.writestr(p+f"material/{name}.png",png((50,60,70,255)))
                  z.writestr(p+f"material/{name}_n.png",png((127,127,250 if name=="one" else 255,255)))
                  z.writestr(p+f"material/{name}.texture_set.json",json.dumps({"format_version":"1.16.100","minecraft:texture_set":{"color":name,"normal":name+"_n"}}))
              z.writestr(p+"glass/neighbor.properties","method=overlay_ctm\nmatchTiles=glass\ntiles=blue\n")
              z.writestr(t+"stone.png",png((255,0,255,255)))
              z.writestr(p+"stone/stone.properties","method=ctm\nmatchTiles=stone\ntiles=0-46\n")
              z.writestr(p+"stone/0.png",png((70,80,90,255)))
              z.writestr("assets/minecraft/optifine/ctm/ignored/ignored.properties","method=ctm\nmatchTiles=gravel\ntiles=0-46\n")
              z.writestr("assets/minecraft/optifine/ctm/ignored/0.png",png((0,0,255,255)))
          PY
      - name: Convert OptiFine random block variation fixture
        run: node scripts/convert-26-3.mjs build/optifine_random_fixture.zip build/optifine_random_fixture.mcpack >build/optifine-random.log 2>&1 || { cat build/optifine-random.log; exit 1; }
      - name: Convert CTM fixture with material maps disabled
        run: node scripts/convert-26-3.mjs build/optifine_random_fixture.zip build/optifine_no_materials.mcpack --no-material-maps >build/optifine-no-materials.log 2>&1 || { cat build/optifine-no-materials.log; exit 1; }
      - name: Verify packaged CTM variants, static fallbacks and baked overlay pixels
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image
          import json
          with ZipFile("build/optifine_random_fixture.mcpack") as z:
              names=set(z.namelist())
              catalog=json.loads(z.read("textures/terrain_texture.json"))
              variations=catalog["texture_data"]["gravel"]["textures"]["variations"]
              assert variations == [
                  {"path":"textures/blocks/optifine_random/gravel/gravel/variant_0","weight":5},
                  {"path":"textures/blocks/optifine_random/gravel/gravel/variant_1","weight":2},
                  {"path":"textures/blocks/gravel","weight":1},
              ], variations
              for index,color in [(0,(255,0,0,255)),(1,(0,255,0,255))]:
                  path=f"textures/blocks/optifine_random/gravel/gravel/variant_{index}.png"
                  assert path in names,path
                  im=Image.open(BytesIO(z.read(path))).convert("RGBA")
                  assert im.size==(32,32),im.size
                  assert im.getpixel((0,0))==color,(path,im.getpixel((0,0)))
              assert "assets/minecraft/optifine/ctm/gravel/gravel.properties" not in names
              assert not any("optifine_random/ignored" in n for n in names)
              data=catalog["texture_data"]
              def pixel(path):
                  im=Image.open(BytesIO(z.read(path))).convert("RGBA")
                  assert im.size==(32,32),(path,im.size)
                  return im.getpixel((0,0))
              grass=data["grass_top"]["textures"]
              assert len(grass)==17 and all(slot==grass[0] for slot in grass),grass
              variants=grass[0]["variations"]
              assert len(variants)==36 and all(v["weight"]==1 for v in variants),variants
              assert pixel(variants[0]["path"]+".png")==pixel("textures/blocks/grass_top.png")== (1,180,20,255)
              for i,v in enumerate(variants,1):
                  assert Image.open(BytesIO(z.read(v["path"]+".png"))).convert("RGBA").getpixel((16,16))==(i,180,20,255)
              assert not any("/grass/snow/" in n for n in names)
              stone=data["stone"]["textures"]
              assert len(stone)==7 and stone[1]=="textures/blocks/stone_granite",stone
              assert pixel(stone[0]+".png")== (70,80,90,255)
              glass=data["glass"]["textures"]["variations"]
              assert [v["weight"] for v in glass]==[3,2],glass
              assert [pixel(v["path"]+".png") for v in glass]==[(0,127,128,255),(0,255,0,255)]
              assert not any("/glass/neighbor/" in n for n in names)
              assert not any(n.startswith("assets/minecraft/optifine/ctm/") for n in names)
              for entry in data.values():
                  for slot in entry["textures"] if isinstance(entry["textures"],list) else [entry["textures"]]:
                      paths=([slot] if isinstance(slot,str) else
                             [v["path"] for v in slot.get("variations",[])] + ([slot["path"]] if "path" in slot else []))
                      for p in paths:
                          if p.startswith("textures/blocks/optifine_random/"): assert p+".png" in names,p
              def material_variants(pack):
                  mat=json.loads(pack.read("textures/terrain_texture.json"))["texture_data"]["diamond_block"]["textures"]
                  if isinstance(mat,list): mat=mat[0]
                  return mat["variations"]
              material=material_variants(z)
              assert [v["weight"] for v in material]==[2,3],material
              for v in material:
                  texture=v["path"]
                  ts=json.loads(z.read(texture+".texture_set.json"))["minecraft:texture_set"]
                  assert texture.rsplit("/",1)[0]+"/"+ts["normal"]+".png" in names
          with ZipFile("build/optifine_no_materials.mcpack") as z:
              mat=material_variants(z)
              assert [v["weight"] for v in mat]==[5],mat
              assert not any("/material/" in n and n.endswith(("_normal.png",".texture_set.json")) for n in z.namelist())
          print(json.dumps({"weighted_random":"ok","repeat_tiles":36,"overlay_chain":"ok","material_opt_out":"ok"}))
          PY
      - name: Prepare Java custom block model fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          from PIL import Image
          from io import BytesIO
          import json
          Path("build").mkdir(exist_ok=True)
          def png(color):
              im=Image.new("RGBA",(32,32),color)
              b=BytesIO(); im.save(b,format="PNG"); return b.getvalue()
          parent={
            "textures":{"surface":"minecraft:block/j2b_red"},
            "elements":[{
              "from":[1,0,2],"to":[15,12,14],
              "faces":{
                "north":{"texture":"#surface","uv":[0,0,16,16],"rotation":90},
                "south":{"texture":"#surface","uv":[0,0,16,16]},
                "east":{"texture":"#surface","uv":[0,0,16,16]},
                "west":{"texture":"#surface","uv":[0,0,16,16]},
                "up":{"texture":"#surface","uv":[0,0,16,16]},
                "down":{"texture":"#surface","uv":[0,0,16,16]}
              }
            }]
          }
          child={"parent":"minecraft:block/j2b_parent","textures":{"surface":"minecraft:block/j2b_green"}}
          blockstate={
            "variants":{
              "facing=north":{"model":"minecraft:block/j2b_child"},
              "facing=east":{"model":"minecraft:block/j2b_child","y":90}
            }
          }
          with ZipFile("build/custom_block_model_fixture.zip","w",ZIP_DEFLATED) as z:
              z.writestr("pack.mcmeta",json.dumps({"pack":{"description":"Custom block model fixture","min_format":[97,1],"max_format":[97,1]}}))
              z.writestr("assets/minecraft/models/block/j2b_parent.json",json.dumps(parent))
              z.writestr("assets/minecraft/models/block/j2b_child.json",json.dumps(child))
              z.writestr("assets/minecraft/blockstates/j2b_demo.json",json.dumps(blockstate))
              z.writestr("assets/minecraft/textures/block/j2b_red.png",png((255,0,0,255)))
              z.writestr("assets/minecraft/textures/block/j2b_green.png",png((0,255,0,255)))
          PY
      - name: Convert Java custom block model fixture to mcaddon
        run: node scripts/convert-26-3.mjs build/custom_block_model_fixture.zip build/custom_block_model_fixture.mcaddon >build/custom-block-model.log 2>&1 || { cat build/custom-block-model.log; exit 1; }
      - name: Verify custom block geometry and companion Behavior Pack
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image
          import json
          with ZipFile("build/custom_block_model_fixture.mcaddon") as z:
              names=set(z.namelist())
              assert "J2B_RP/manifest.json" in names
              assert "J2B_BP/manifest.json" in names
              rp=json.loads(z.read("J2B_RP/manifest.json"))
              bp=json.loads(z.read("J2B_BP/manifest.json"))
              assert rp["header"]["pack_scope"]=="world"
              assert rp["header"]["min_engine_version"]==[1,21,80]
              assert bp["header"]["min_engine_version"]==[1,21,80]
              assert any(d["uuid"]==bp["header"]["uuid"] for d in rp["dependencies"])
              assert any(d["uuid"]==rp["header"]["uuid"] for d in bp["dependencies"])

              report=json.loads(z.read("J2B_RP/j2b_custom_blocks.json"))
              mappings=report["mappings"]
              assert report["namespace"].startswith("j2b_"),report["namespace"]
              assert len(report["namespace"])==12,report["namespace"]
              assert len(mappings)==2,mappings
              assert all(m["bedrock_block"].startswith(report["namespace"]+":") for m in mappings)
              assert all(m["geometry"].startswith("geometry."+report["namespace"]+".") for m in mappings)
              assert {m["java_variant"] for m in mappings}=={"facing=north","facing=east"}
              assert all(m["java_model"]=="minecraft:block/j2b_child" for m in mappings)
              assert all(m["java_block"]=="minecraft:j2b_demo" for m in mappings)

              east=next(m for m in mappings if m["java_variant"]=="facing=east")
              north=next(m for m in mappings if m["java_variant"]=="facing=north")
              for m in mappings:
                  geo_path="J2B_RP/"+m["geometry_file"]
                  bp_path="J2B_BP/"+m["behavior_file"].removeprefix("j2b_companion/")
                  tex_path="J2B_RP/"+m["texture_file"]
                  assert geo_path in names,geo_path
                  assert bp_path in names,bp_path
                  assert tex_path in names,tex_path
                  img=Image.open(BytesIO(z.read(tex_path))).convert("RGBA")
                  assert img.size==(32,32),img.size
                  assert img.getpixel((0,0))==(0,255,0,255),img.getpixel((0,0))
                  block=json.loads(z.read(bp_path))["minecraft:block"]
                  assert block["components"]["minecraft:geometry"]==m["geometry"]
                  assert block["components"]["minecraft:material_instances"]["*"]["texture"]==m["texture_key"]

              north_geo=json.loads(z.read("J2B_RP/"+north["geometry_file"]))["minecraft:geometry"][0]
              east_geo=json.loads(z.read("J2B_RP/"+east["geometry_file"]))["minecraft:geometry"][0]
              assert north_geo["description"]["texture_width"]==32
              cube=north_geo["bones"][0]["cubes"][0]
              assert cube["origin"]==[-7,0,-6],cube["origin"]
              assert cube["size"]==[14,12,12],cube["size"]
              assert cube["uv"]["north"]["uv"]==[0,0]
              assert cube["uv"]["north"]["uv_size"]==[32,32]
              assert cube["uv"]["north"]["uv_rotation"]==90
              assert "rotation" not in north_geo["bones"][0]
              assert east_geo["bones"][0]["rotation"]==[0,-90,0],east_geo["bones"][0]
          print(json.dumps({"custom_blocks":2,"atlas_size":[32,32],"companion_bp":"ok","parent_texture_override":"ok","y_rotation":"ok"}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-block-model-addon-proof
          path: |
            build/custom_block_model_fixture.mcaddon
            build/custom-block-model.log
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare 3x full Java UV scale test pack
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          from PIL import Image
          from io import BytesIO
          import json
          origin=Path("java-vanilla/assets/minecraft/textures")
          images=sorted(origin.rglob("*.png"))
          assert len(images)>3500,len(images)
          out=Path("build/java_26_3_vanilla_3x.zip")
          with ZipFile(out,"w",ZIP_DEFLATED,compresslevel=3) as z:
              z.writestr("pack.mcmeta",json.dumps({"pack":{"description":"Java 26.3 3x UV scale test","min_format":[97,1],"max_format":[97,1]}}))
              for index,f in enumerate(images,1):
                  with Image.open(f) as src:
                      rgba=src.convert("RGBA")
                      scaled=rgba.resize((rgba.width*3,rgba.height*3),Image.Resampling.NEAREST)
                      buf=BytesIO()
                      scaled.save(buf,format="PNG",optimize=False)
                  z.writestr(str(Path("assets/minecraft/textures")/f.relative_to(origin)),buf.getvalue())
                  if index%500==0: print("upscaled",index)
          print("3x Java source PNGs",len(images))
          PY
      - name: Convert 3x full Java UV scale test pack
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/convert-26-3.mjs build/java_26_3_vanilla_3x.zip build/java26_3_uv_hd_3x.mcpack >build/conversion-uv-hd-3x.log 2>&1 || { tail -n 200 build/conversion-uv-hd-3x.log; exit 1; }
      - name: Verify UV converters preserve 3x resolution
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import json
          targets=[
            "textures/entity/horse/horse_black.png",
            "textures/entity/horse2/horse_black.png",
            "textures/entity/horse2/armor/horse_armor_none.png",
            "textures/entity/dolphin.png",
            "textures/entity/fox/fox.png",
            "textures/entity/zombie/drowned.tga",
            "textures/entity/turtle/turtle.png",
            "textures/entity/arrows.png",
            "textures/entity/dragon/dragon.tga",
            "textures/entity/dragon/dragon_exploding.png",
            "textures/entity/cow/cow_v2.png",
            "textures/entity/pig/pig_saddle.png",
            "textures/entity/saddle_v2.png",
            "textures/entity/lead_knot.png",
            "textures/entity/villager2/professions/unskilled.tga",
            "textures/entity/zombie_villager2/professions/unskilled.tga",
            "textures/entity/bed/red.png",
            "textures/entity/sign.png",
            "textures/entity/oak_hanging_sign.png",
            "textures/blocks/bamboo_fence_gate.png",
            "textures/entity/pistonarm/pistonArm.png",
            "textures/blocks/copper_chain1.png",
            "textures/items/compass_atlas.png",
            "textures/particle/orange_poplar_leaves_atlas.png",
            "textures/blocks/chest_front.png"
          ]
          proof=Path("build/uv-hd-proof")
          proof.mkdir(parents=True,exist_ok=True)
          report={}
          with ZipFile("build/java26_3-to-bedrock1_26_50_4.mcpack") as base, ZipFile("build/java26_3_uv_hd_3x.mcpack") as hd:
              bn=set(base.namelist()); hn=set(hd.namelist())
              for path in targets:
                  assert path in bn,path
                  assert path in hn,path
                  a=Image.open(BytesIO(base.read(path))).convert("RGBA")
                  b=Image.open(BytesIO(hd.read(path))).convert("RGBA")
                  expected_size=(a.width*3,a.height*3)
                  assert b.size==expected_size,(path,a.size,b.size,expected_size)
                  expected=a.resize(expected_size,Image.Resampling.NEAREST)
                  exact=b.tobytes()==expected.tobytes()
                  safe=path.replace("/","__").rsplit(".",1)[0]+".png"
                  b.save(proof/safe)
                  diff_pixels=sum(1 for bp,ep in zip(b.getdata(),expected.getdata()) if bp!=ep)
                  if not exact:
                      expected.save(proof/(safe[:-4]+"__expected.png"))
                  report[path]={"base_size":list(a.size),"hd3x_size":list(b.size),"pixel_exact_to_base_3x":exact,"diff_pixels":diff_pixels}
          (proof/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report))
          failed=[p for p,m in report.items() if not m["pixel_exact_to_base_3x"]]
          assert not failed, f"3x scale-equivalence mismatches: {failed}"
          PY
      - name: Prepare HD chest scale test packs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          from PIL import Image
          import json
          src=Image.open("java-vanilla/assets/minecraft/textures/entity/chest/normal.png").convert("RGBA")
          assert src.size==(64,64),src.size
          root=Path("build/chest-hd-proof")
          root.mkdir(parents=True,exist_ok=True)
          for factor in (2,3,16):
              scaled=src.resize((64*factor,64*factor),Image.Resampling.NEAREST)
              png=root/f"java_normal_{factor}x.png"
              scaled.save(png)
              with ZipFile(root/f"java_chest_{factor}x.zip","w",ZIP_DEFLATED) as z:
                  z.writestr("pack.mcmeta",json.dumps({"pack":{"description":f"Java 26.3 chest {factor}x scale test","min_format":[97,1],"max_format":[97,1]}}))
                  z.write(png,"assets/minecraft/textures/entity/chest/normal.png")
          PY
      - name: Convert HD chest scale test packs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for factor in 2 3 16; do
            node scripts/convert-26-3.mjs               "build/chest-hd-proof/java_chest_${factor}x.zip"               "build/chest-hd-proof/bedrock_chest_${factor}x.mcpack"               >"build/chest-hd-proof/conversion_${factor}x.log" 2>&1 || {
                cat "build/chest-hd-proof/conversion_${factor}x.log"
                exit 1
              }
          done
      - name: Verify HD chest scale invariance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image
          import json
          root=Path("build/chest-hd-proof")
