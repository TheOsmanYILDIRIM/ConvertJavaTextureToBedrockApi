name: Convert Java 26.3 vanilla textures
on:
  push:
    branches:
      - feature/java26-3-full-conversion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Java 26.3 assets
        uses: actions/checkout@v4
        with:
          repository: InventivetalentDev/minecraft-assets
          ref: aaf3b3dbdf72b5723861324984813f3fd87db179
          path: java-vanilla
          sparse-checkout: |
            assets/minecraft/textures
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout pinned Bedrock reference textures
        uses: actions/checkout@v4
        with:
          repository: Mojang/bedrock-samples
          ref: 15701fa9c13923f12662984c32c124327e40e3d3
          path: bedrock-vanilla
          sparse-checkout: |
            resource_pack/textures/entity
            resource_pack/textures/blocks
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --omit=dev --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<13'
      - name: Check JavaScript
        run: find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Prepare vanilla Java ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import json
          origin=Path("java-vanilla/assets/minecraft/textures")
          images=sorted(origin.rglob("*.png"))
          assert len(images)>3500, len(images)
          Path("build").mkdir(exist_ok=True)
          with ZipFile("build/java_26_3_vanilla.zip","w",ZIP_DEFLATED,compresslevel=4) as z:
              z.writestr("pack.mcmeta",json.dumps({"pack":{"description":"Java 26.3 vanilla conversion test","min_format":[97,1],"max_format":[97,1]}}))
              for f in images:z.write(f,str(Path("assets/minecraft/textures")/f.relative_to(origin)))
          print("Java source PNGs",len(images))
          PY
      - name: Convert texture pack with fork engine
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/convert-26-3.mjs build/java_26_3_vanilla.zip build/java26_3-to-bedrock1_26_50_4.mcpack >build/conversion.log 2>&1 || { tail -n 150 build/conversion.log; exit 1; }
      - name: Check Bedrock result
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          p="build/java26_3-to-bedrock1_26_50_4.mcpack"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              a=set(z.namelist())
              m=json.loads(z.read("manifest.json"))
              count=sum(x.endswith(".png") for x in a)
              assert m["format_version"]==2,m
              assert m["header"]["min_engine_version"]==[1,26,0]
              assert count>1000,count
              beds=["white","orange","magenta","light_blue","yellow","lime","pink","gray","light_gray","cyan","purple","blue","brown","green","red","black"]
              woods=["oak","spruce","birch","jungle","acacia","dark_oak","mangrove","cherry","bamboo","crimson","warped","pale_oak","poplar"]
              modern_suffix={"bamboo","cherry","mangrove","pale_oak","poplar"}
              expected_beds={f"textures/entity/bed/{'silver' if c=='light_gray' else c}.png" for c in beds}
              expected_signs={f"textures/entity/{w}_hanging_sign.png" for w in woods}
              expected_signs|={f"textures/entity/{'sign' if w=='oak' else w+'_sign' if w in modern_suffix else 'sign_'+('darkoak' if w=='dark_oak' else w)}.png" for w in woods}
              expected_copper={f"textures/entity/chest/copper_{variant}{suffix}.png" for variant in ["default","exposed","weathered","oxidized"] for suffix in ["","_double"]}
              expected_opaque={"textures/blocks/leaves_oak_opaque.png","textures/blocks/leaves_birch_opaque.png"}
              entity_family_required={"textures/entity/camel/camel.png","textures/entity/camel_husk/camel_husk.png","textures/entity/horse2/horse_black.png","textures/entity/horse2/mule.png","textures/entity/horse2/armor/horse_armor_copper.png","textures/entity/horse2/armor/horse_armor_netherite.png","textures/entity/pig/pig_saddle.png","textures/entity/saddle_v2.png","textures/entity/dolphin.png","textures/entity/fox/arctic_fox.png","textures/entity/lead_knot.png","textures/entity/cow/cow_v2.png","textures/entity/cow/brown_mooshroom_v2.png","textures/entity/cow/mooshroom_v2.png","textures/entity/villager2/biomes/biome_savanna_baby.png","textures/entity/villager2/biomes/biome_swamp_baby.png","textures/entity/zombie_villager2/biomes/biome_plains_baby.png","textures/entity/zombie_villager2/biomes/biome_savanna_baby.png","textures/entity/zombie_villager2/biomes/biome_swamp_baby.png","textures/entity/villager2/professions/unskilled.tga","textures/entity/zombie_villager2/professions/unskilled.tga"}
              required=expected_beds | expected_signs | expected_copper | expected_opaque | entity_family_required | {"textures/particle/particles.png"}
              missing=sorted(required-a)
              assert not missing, f"Missing generated family textures: {missing}"

              from io import BytesIO
              from PIL import Image,ImageChops
              reference_root=Path("bedrock-vanilla/resource_pack")

              def output_rgba(name):
                  return Image.open(BytesIO(z.read(name))).convert("RGBA")

              def reference_rgba(name):
                  return Image.open(reference_root / name).convert("RGBA")

              exact_hanging=["oak","spruce","birch","jungle","acacia","dark_oak",
                             "mangrove","cherry","bamboo","crimson","warped","pale_oak"]
              for wood in exact_hanging:
                  name=f"textures/entity/{wood}_hanging_sign.png"
                  out=output_rgba(name)
                  ref=reference_rgba(name)
                  assert out.size==ref.size,(name,out.size,ref.size)
                  assert ImageChops.difference(out,ref).getbbox() is None, f"Hanging sign pixel mismatch: {wood}"

              # Poplar geometry is shared, but the pinned Java/Bedrock source
              # snapshots use slightly different poplar colours.
              poplar=output_rgba("textures/entity/poplar_hanging_sign.png")
              poplar_ref=reference_rgba("textures/entity/poplar_hanging_sign.png")
              assert poplar.getchannel("A").tobytes()==poplar_ref.getchannel("A").tobytes(), "Poplar hanging sign UV mismatch"

              gate=output_rgba("textures/blocks/bamboo_fence_gate.png")
              gate_ref=reference_rgba("textures/blocks/bamboo_fence_gate.png")
              assert ImageChops.difference(gate,gate_ref).getbbox() is None, "Bamboo fence gate pixel mismatch"

              oak=output_rgba("textures/blocks/leaves_oak_opaque.png")
              oak_ref=reference_rgba("textures/blocks/leaves_oak_opaque.png")
              assert min(oak.getchannel("A").getextrema())==255, "Opaque oak still has transparency"
              oak_delta=ImageChops.difference(oak,oak_ref)
              assert max(channel[1] for channel in oak_delta.getextrema())<=1, f"Opaque oak diverges from Bedrock: {oak_delta.getextrema()}"

              alpha_family=["textures/entity/camel/camel.png","textures/entity/camel_husk/camel_husk.png",
                            "textures/entity/horse2/horse_black.png","textures/entity/horse2/mule.png",
                            "textures/entity/dolphin.png","textures/entity/fox/arctic_fox.png",
                            "textures/entity/cow/cow_v2.png"]
              for name in alpha_family:
                  out=output_rgba(name); ref=reference_rgba(name)
                  assert out.size==ref.size,(name,out.size,ref.size)
                  assert out.getchannel("A").tobytes()==ref.getchannel("A").tobytes(), f"Entity UV alpha mismatch: {name}"
              for name in ["textures/entity/pig/pig_saddle.png","textures/entity/lead_knot.png"]:
                  out=output_rgba(name); ref=reference_rgba(name)
                  assert ImageChops.difference(out,ref).getbbox() is None, f"Entity exact mismatch: {name}"

              print(json.dumps({"pngs":count,"total":len(a),"beds":len(expected_beds),"signs":len(expected_signs),"copper_chests":len(expected_copper),"entity_family_targets":len(entity_family_required),"pixel_verified":{"hanging_signs":13,"bamboo_fence_gate":True,"oak_opaque_max_channel_delta":1,"entity_alpha_family":len(alpha_family),"entity_exact":2}}))
          PY
      - name: Build entity UV review boards
        if: always()
        run: |
          if [ -f build/java26_3-to-bedrock1_26_50_4.mcpack ]; then
            python3 scripts/build-uv-review.py \
              --mcpack build/java26_3-to-bedrock1_26_50_4.mcpack \
              --java-root java-vanilla/assets/minecraft/textures \
              --bedrock-root bedrock-vanilla/resource_pack/textures \
              --out build/uv-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: converted-java26-3-bedrock-pack
          path: |
            build/java_26_3_vanilla.zip
            build/java26_3-to-bedrock1_26_50_4.mcpack
            build/conversion.log
            build/uv-review
          if-no-files-found: warn
          retention-days: 7
