name: Convert Java 26.3 vanilla textures
on:
  push:
    branches:
      - feature/java26-3-full-conversion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Java 26.3 assets
        uses: actions/checkout@v4
        with:
          repository: InventivetalentDev/minecraft-assets
          ref: aaf3b3dbdf72b5723861324984813f3fd87db179
          path: java-vanilla
          sparse-checkout: |
            assets/minecraft/textures
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout pinned Bedrock reference textures
        uses: actions/checkout@v4
        with:
          repository: Mojang/bedrock-samples
          ref: 15701fa9c13923f12662984c32c124327e40e3d3
          path: bedrock-vanilla
          sparse-checkout: |
            resource_pack/textures/entity
            resource_pack/textures/blocks
            resource_pack/textures/items
            resource_pack/textures/particle
            resource_pack/textures/environment
            resource_pack/textures/colormap
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install --omit=dev --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<13'
      - name: Check JavaScript
        run: find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Prepare vanilla Java ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import json
          origin=Path("java-vanilla/assets/minecraft/textures")
          images=sorted(origin.rglob("*.png"))
          assert len(images)>3500, len(images)
          Path("build").mkdir(exist_ok=True)
          with ZipFile("build/java_26_3_vanilla.zip","w",ZIP_DEFLATED,compresslevel=4) as z:
              z.writestr("pack.mcmeta",json.dumps({"pack":{"description":"Java 26.3 vanilla conversion test","min_format":[97,1],"max_format":[97,1]}}))
              for f in images:z.write(f,str(Path("assets/minecraft/textures")/f.relative_to(origin)))
          print("Java source PNGs",len(images))
          PY
      - name: Convert texture pack with fork engine
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/convert-26-3.mjs build/java_26_3_vanilla.zip build/java26_3-to-bedrock1_26_50_4.mcpack >build/conversion.log 2>&1 || { tail -n 150 build/conversion.log; exit 1; }
      - name: Check Bedrock result
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          p="build/java26_3-to-bedrock1_26_50_4.mcpack"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              a=set(z.namelist())
              m=json.loads(z.read("manifest.json"))
              count=sum(x.endswith(".png") for x in a)
              assert m["format_version"]==2,m
              assert m["header"]["min_engine_version"]==[1,26,0]
              assert count>1000,count
              beds=["white","orange","magenta","light_blue","yellow","lime","pink","gray","light_gray","cyan","purple","blue","brown","green","red","black"]
              woods=["oak","spruce","birch","jungle","acacia","dark_oak","mangrove","cherry","bamboo","crimson","warped","pale_oak","poplar"]
              modern_suffix={"bamboo","cherry","mangrove","pale_oak","poplar"}
              expected_beds={f"textures/entity/bed/{'silver' if c=='light_gray' else c}.png" for c in beds}
              expected_signs={f"textures/entity/{w}_hanging_sign.png" for w in woods}
              expected_signs|={f"textures/entity/{'sign' if w=='oak' else w+'_sign' if w in modern_suffix else 'sign_'+('darkoak' if w=='dark_oak' else w)}.png" for w in woods}
              expected_copper={f"textures/entity/chest/copper_{variant}{suffix}.png" for variant in ["default","exposed","weathered","oxidized"] for suffix in ["","_double"]}
              expected_opaque={"textures/blocks/leaves_oak_opaque.png","textures/blocks/leaves_birch_opaque.png"}
              entity_family_required={"textures/entity/camel/camel.png","textures/entity/camel_husk/camel_husk.png","textures/entity/horse2/horse_black.png","textures/entity/horse2/mule.png","textures/entity/horse2/armor/horse_armor_copper.png","textures/entity/horse2/armor/horse_armor_netherite.png","textures/entity/pig/pig_saddle.png","textures/entity/saddle_v2.png","textures/entity/dolphin.png","textures/entity/fox/arctic_fox.png","textures/entity/lead_knot.png","textures/entity/cow/cow_v2.png","textures/entity/cow/brown_mooshroom_v2.png","textures/entity/cow/mooshroom_v2.png","textures/entity/villager2/biomes/biome_savanna_baby.png","textures/entity/villager2/biomes/biome_swamp_baby.png","textures/entity/zombie_villager2/biomes/biome_plains_baby.png","textures/entity/zombie_villager2/biomes/biome_savanna_baby.png","textures/entity/zombie_villager2/biomes/biome_swamp_baby.png","textures/entity/villager2/professions/unskilled.tga","textures/entity/zombie_villager2/professions/unskilled.tga"}
              structural_family_required={"textures/blocks/copper_chain1.png","textures/blocks/copper_chain2.png","textures/blocks/exposed_copper_chain1.png","textures/blocks/exposed_copper_chain2.png","textures/blocks/weathered_copper_chain1.png","textures/blocks/weathered_copper_chain2.png","textures/blocks/oxidized_copper_chain1.png","textures/blocks/oxidized_copper_chain2.png","textures/blocks/eyeblossom_blooming.png","textures/blocks/lightning_rod_powered.png","textures/items/bundle_open.png","textures/items/bundle_black_open.png","textures/items/bundle_blue_open.png","textures/items/compass_atlas.png","textures/items/recovery_compass_atlas.png","textures/particle/geyser_base.png","textures/particle/sculk_charge_pop.png","textures/particle/sculk_soul.png","textures/particle/small_gust.png","textures/particle/soul.png","textures/particle/orange_poplar_leaves_atlas.png","textures/particle/red_poplar_leaves_atlas.png","textures/particle/yellow_poplar_leaves_atlas.png"}
              tint_family_required={"textures/blocks/grass_carried.png","textures/blocks/double_plant_fern_carried.png","textures/blocks/double_plant_grass_carried.png","textures/blocks/fern_carried.tga","textures/blocks/tallgrass.tga","textures/blocks/tallgrass_carried.tga","textures/blocks/vine_carried.png","textures/blocks/leaves_oak_carried.tga","textures/blocks/leaves_spruce_carried.tga","textures/items/bush.png"}
              pane_colors=["","black","blue","brown","cyan","gray","green","light_blue","silver","lime","magenta","orange","pink","purple","red","white","yellow"]
              pane_family={f"textures/blocks/glass_pane_top{('_'+c) if c else ''}.png" for c in pane_colors}
              copper_inventory={f"textures/blocks/{prefix}_copper_chest_inventory_{face}.png" for prefix in ["exposed","weathered","oxidized"] for face in ["front","side","top"]}
              copper_inventory|={f"textures/blocks/copper_chest_inventory_{face}.png" for face in ["front","side","top"]}
              chest_inventory={"textures/blocks/chest_front.png","textures/blocks/chest_side.png","textures/blocks/chest_top.png","textures/blocks/trapped_chest_front.png","textures/blocks/ender_chest_front.png","textures/blocks/ender_chest_side.png","textures/blocks/ender_chest_top.png"}
              exact_family_required={"textures/environment/end_sky.png","textures/environment/sun_vv.png","textures/entity/pig/pig.png","textures/blocks/carrots_stage_3.png","textures/blocks/cherry_log_side.png","textures/blocks/pale_moss.png","textures/blocks/shelf_mushroom_large.png","textures/blocks/shelf_mushroom_small.png","textures/blocks/stripped_cherry_log_side.png","textures/entity/boat/cherry_boat.png","textures/entity/boat/mangrove_boat.png","textures/entity/chicken/chicken.png","textures/entity/guardian_elder.png","textures/entity/squid.png","textures/items/spawn_egg_sulfur_cube.png","textures/items/spawn_eggs/spawn_egg_sulfur_cube.png"}
              liquid_family={"textures/blocks/water_still.png","textures/blocks/water_flow.png","textures/blocks/water_still_grey.png","textures/blocks/water_flow_grey.png","textures/blocks/lava_still.png","textures/blocks/lava_flow.png"}
              required=expected_beds | expected_signs | expected_copper | expected_opaque | entity_family_required | structural_family_required | tint_family_required | pane_family | copper_inventory | chest_inventory | exact_family_required | liquid_family | {"textures/particle/particles.png"}
              missing=sorted(required-a)
              assert not missing, f"Missing generated family textures: {missing}"

              from io import BytesIO
              from PIL import Image,ImageChops
              reference_root=Path("bedrock-vanilla/resource_pack")

              def output_rgba(name):
                  return Image.open(BytesIO(z.read(name))).convert("RGBA")

              def reference_rgba(name):
                  return Image.open(reference_root / name).convert("RGBA")

              def java_chest(name):
                  return Image.open(Path("java-vanilla/assets/minecraft/textures/entity/chest") / name).convert("RGBA")

              def rgba_diff_pixels(a,b):
                  assert a.size==b.size,(a.size,b.size)
                  return sum(1 for ap,bp in zip(a.getdata(),b.getdata()) if ap != bp)

              def expected_vertical_core(source,x):
                  lid=source.crop((x,14,x+14,19)).transpose(Image.Transpose.ROTATE_180)
                  base=source.crop((x,33,x+14,43)).transpose(Image.Transpose.ROTATE_180)
                  core=Image.new("RGBA",(14,15))
                  core.paste(lid,(0,0)); core.paste(base,(0,5))
                  return core

              chest_sources={
                  "normal.png":{"front":"textures/blocks/chest_front.png","side":"textures/blocks/chest_side.png","top":"textures/blocks/chest_top.png"},
                  "trapped.png":{"front":"textures/blocks/trapped_chest_front.png"},
                  "ender.png":{"front":"textures/blocks/ender_chest_front.png","side":"textures/blocks/ender_chest_side.png","top":"textures/blocks/ender_chest_top.png"},
                  "copper.png":{"front":"textures/blocks/copper_chest_inventory_front.png","side":"textures/blocks/copper_chest_inventory_side.png","top":"textures/blocks/copper_chest_inventory_top.png"},
                  "copper_exposed.png":{"front":"textures/blocks/exposed_copper_chest_inventory_front.png","side":"textures/blocks/exposed_copper_chest_inventory_side.png","top":"textures/blocks/exposed_copper_chest_inventory_top.png"},
                  "copper_weathered.png":{"front":"textures/blocks/weathered_copper_chest_inventory_front.png","side":"textures/blocks/weathered_copper_chest_inventory_side.png","top":"textures/blocks/weathered_copper_chest_inventory_top.png"},
                  "copper_oxidized.png":{"front":"textures/blocks/oxidized_copper_chest_inventory_front.png","side":"textures/blocks/oxidized_copper_chest_inventory_side.png","top":"textures/blocks/oxidized_copper_chest_inventory_top.png"},
              }
              chest_diff_pixels={}
              copper_top_inner_exact=[]
              for source_name,faces in chest_sources.items():
                  source=java_chest(source_name)
                  assert source.size==(64,64),(source_name,source.size)
                  for face,target in faces.items():
                      out=output_rgba(target); ref=reference_rgba(target)
                      assert out.size==(16,16),(target,out.size)
                      assert out.getchannel("A").tobytes()==ref.getchannel("A").tobytes(), f"Chest alpha mismatch: {target}"
                      if face=="front":
                          assert out.crop((1,1,15,16)).tobytes()==expected_vertical_core(source,42).tobytes(), f"Chest front Java UV phase mismatch: {target}"
                      elif face=="side":
                          assert out.crop((1,1,15,16)).tobytes()==expected_vertical_core(source,28).tobytes(), f"Chest side Java UV phase mismatch: {target}"
                      else:
                          top_core=source.crop((28,0,42,14)).transpose(Image.Transpose.FLIP_LEFT_RIGHT)
                          assert out.crop((1,1,15,15)).tobytes()==top_core.tobytes(), f"Chest top Java UV phase mismatch: {target}"
                          if source_name.startswith("copper"):
                              assert out.crop((1,1,15,15)).tobytes()==ref.crop((1,1,15,15)).tobytes(), f"Copper top inner pixels differ: {target}"
                              copper_top_inner_exact.append(target)
                      chest_diff_pixels[target]=rgba_diff_pixels(out,ref)

              exact_hanging=["oak","spruce","birch","jungle","acacia","dark_oak",
                             "mangrove","cherry","bamboo","crimson","warped","pale_oak"]
              for wood in exact_hanging:
                  name=f"textures/entity/{wood}_hanging_sign.png"
                  out=output_rgba(name)
                  ref=reference_rgba(name)
                  assert out.size==ref.size,(name,out.size,ref.size)
                  assert ImageChops.difference(out,ref).getbbox() is None, f"Hanging sign pixel mismatch: {wood}"

              # Poplar geometry is shared, but the pinned Java/Bedrock source
              # snapshots use slightly different poplar colours.
              poplar=output_rgba("textures/entity/poplar_hanging_sign.png")
              poplar_ref=reference_rgba("textures/entity/poplar_hanging_sign.png")
              assert poplar.getchannel("A").tobytes()==poplar_ref.getchannel("A").tobytes(), "Poplar hanging sign UV mismatch"

              gate=output_rgba("textures/blocks/bamboo_fence_gate.png")
              gate_ref=reference_rgba("textures/blocks/bamboo_fence_gate.png")
              assert ImageChops.difference(gate,gate_ref).getbbox() is None, "Bamboo fence gate pixel mismatch"

              oak=output_rgba("textures/blocks/leaves_oak_opaque.png")
              oak_ref=reference_rgba("textures/blocks/leaves_oak_opaque.png")
              assert min(oak.getchannel("A").getextrema())==255, "Opaque oak still has transparency"
              oak_delta=ImageChops.difference(oak,oak_ref)
              assert max(channel[1] for channel in oak_delta.getextrema())<=1, f"Opaque oak diverges from Bedrock: {oak_delta.getextrema()}"

              alpha_family=["textures/entity/camel/camel.png","textures/entity/camel_husk/camel_husk.png",
                            "textures/entity/horse2/horse_black.png","textures/entity/horse2/mule.png",
                            "textures/entity/dolphin.png","textures/entity/fox/arctic_fox.png",
                            "textures/entity/cow/cow_v2.png"]
              for name in alpha_family:
                  out=output_rgba(name); ref=reference_rgba(name)
                  assert out.size==ref.size,(name,out.size,ref.size)
                  assert out.getchannel("A").tobytes()==ref.getchannel("A").tobytes(), f"Entity UV alpha mismatch: {name}"
              for name in ["textures/entity/pig/pig_saddle.png","textures/entity/lead_knot.png"]:
                  out=output_rgba(name); ref=reference_rgba(name)
                  assert ImageChops.difference(out,ref).getbbox() is None, f"Entity exact mismatch: {name}"

              arrow=output_rgba("textures/entity/arrows.png")
              arrow_ref=reference_rgba("textures/entity/arrows.png")
              assert arrow.getchannel("A").tobytes()==arrow_ref.getchannel("A").tobytes(), "Arrow UV/alpha mismatch"
              arrow_delta=max(abs(a-b) for op,rp in zip(arrow.getdata(),arrow_ref.getdata()) if rp[3] for a,b in zip(op[:3],rp[:3]))
              assert arrow_delta <= 3, f"Arrow visible RGB delta {arrow_delta}"

              def assert_visible_exact(name):
                  out=output_rgba(name); ref=reference_rgba(name)
                  assert out.size==ref.size,(name,out.size,ref.size)
                  assert out.getchannel("A").tobytes()==ref.getchannel("A").tobytes(), f"Alpha mismatch: {name}"
                  op=out.load(); rp=ref.load()
                  for yy in range(out.height):
                      for xx in range(out.width):
                          if rp[xx,yy][3] and op[xx,yy] != rp[xx,yy]:
                              raise AssertionError(f"Visible pixel mismatch: {name} @ {(xx,yy)}")

              professions=["armorer","butcher","cartographer","cleric","farmer","fisherman","fletcher","leatherworker","librarian","nitwit","shepherd","stonemason","toolsmith","weaponsmith"]
              for profession in professions:
                  if profession != "cleric":
                      assert_visible_exact(f"textures/entity/villager2/professions/{profession}.tga")
                  assert_visible_exact(f"textures/entity/zombie_villager2/professions/{profession}.tga")
              cleric=output_rgba("textures/entity/villager2/professions/cleric.tga")
              cleric_ref=reference_rgba("textures/entity/villager2/professions/cleric.tga")
              assert cleric.getchannel("A").tobytes()==cleric_ref.getchannel("A").tobytes(), "cleric UV/alpha mismatch"
              cleric_visible_diffs=sum(1 for op,rp in zip(cleric.getdata(),cleric_ref.getdata()) if rp[3] and op[:3] != rp[:3])
              assert cleric_visible_diffs <= 14, f"cleric visible edition-art drift {cleric_visible_diffs}"

              assert_visible_exact("textures/entity/dragon/dragon.tga")
              dragon_exploding=output_rgba("textures/entity/dragon/dragon_exploding.png")
              dragon_exploding_ref=reference_rgba("textures/entity/dragon/dragon_exploding.png")
              assert [a>0 for a in dragon_exploding.getchannel("A").getdata()] == [a>0 for a in dragon_exploding_ref.getchannel("A").getdata()], "dragon exploding UV alpha-mask mismatch"
              assert all(op[:3] == rp[:3] for op,rp in zip(dragon_exploding.getdata(),dragon_exploding_ref.getdata()) if rp[3]), "dragon exploding visible RGB mismatch"

              for name in ["textures/blocks/copper_chain1.png","textures/blocks/copper_chain2.png",
                           "textures/blocks/oxidized_copper_chain1.png","textures/blocks/oxidized_copper_chain2.png",
                           "textures/blocks/eyeblossom_blooming.png","textures/blocks/lightning_rod_powered.png",
                           "textures/items/bundle_blue_open.png","textures/items/compass_atlas.png","textures/items/recovery_compass_atlas.png",
                           "textures/particle/sculk_charge_pop.png","textures/particle/sculk_soul.png",
                           "textures/particle/small_gust.png","textures/particle/soul.png",
                           "textures/particle/red_poplar_leaves_atlas.png","textures/particle/yellow_poplar_leaves_atlas.png"]:
                  assert_visible_exact(name)

              for name in sorted(pane_family) + ["textures/environment/end_sky.png","textures/environment/sun_vv.png"]:
                  out=output_rgba(name); ref=reference_rgba(name)
                  assert ImageChops.difference(out,ref).getbbox() is None, f"exact parity family mismatch: {name}"
              pig_legacy=output_rgba("textures/entity/pig/pig.png")
              pig_legacy_ref=reference_rgba("textures/entity/pig/pig.png")
              assert pig_legacy.size==pig_legacy_ref.size
              assert pig_legacy.getchannel("A").tobytes()==pig_legacy_ref.getchannel("A").tobytes(), "legacy pig UV mismatch"
              for name in copper_inventory | chest_inventory:
                  assert output_rgba(name).size==(16,16), (name,output_rgba(name).size)

              grass=output_rgba("textures/blocks/grass_carried.png")
              grass_ref=reference_rgba("textures/blocks/grass_carried.png")
              assert ImageChops.difference(grass,grass_ref).getbbox() is None, "grass carried colormap tint mismatch"
              bush=output_rgba("textures/items/bush.png")
              bush_ref=reference_rgba("textures/items/bush.png")
              assert bush.getchannel("A").tobytes()==bush_ref.getchannel("A").tobytes(), "bush alpha mismatch"
              bush_delta=max(abs(a-b) for op,rp in zip(bush.getdata(),bush_ref.getdata()) for a,b in zip(op[:3],rp[:3]))
              assert bush_delta <= 1, f"bush visible tint delta {bush_delta}"

              water_alpha={
                  "textures/blocks/water_still.png":255,
                  "textures/blocks/water_flow.png":255,
                  "textures/blocks/water_still_grey.png":240,
                  "textures/blocks/water_flow_grey.png":255,
              }
              for name,alpha in water_alpha.items():
                  out=output_rgba(name)
                  assert out.getchannel("A").getextrema()==(alpha,alpha), (name,out.getchannel("A").getextrema())

              lava_flow=output_rgba("textures/blocks/lava_flow.png")
              lava_flow_ref=reference_rgba("textures/blocks/lava_flow.png")
              assert ImageChops.difference(lava_flow,lava_flow_ref).getbbox() is None, "lava_flow mismatch"

              lava_still=output_rgba("textures/blocks/lava_still.png")
              lava_still_ref=reference_rgba("textures/blocks/lava_still.png")
              assert lava_still.width==16 and lava_still.height%16==0
              assert lava_still_ref.size==(16,512)
              # The pinned Java source has 20 frames while current Bedrock ships 32.
              # The shared first 19 frames are exact; do not invent/bake the Bedrock-only tail
              # into custom packs merely to force vanilla-reference dimensions.
              shared_h=19*16
              assert ImageChops.difference(lava_still.crop((0,0,16,shared_h)),lava_still_ref.crop((0,0,16,shared_h))).getbbox() is None, "lava_still shared frames mismatch"

              print(json.dumps({"pngs":count,"total":len(a),"beds":len(expected_beds),"signs":len(expected_signs),"copper_chests":len(expected_copper),"entity_family_targets":len(entity_family_required),"structural_family_targets":len(structural_family_required),"tint_family_targets":len(tint_family_required),"pixel_verified":{"hanging_signs":13,"bamboo_fence_gate":True,"oak_opaque_max_channel_delta":1,"entity_alpha_family":len(alpha_family),"entity_exact":2,"villager_profession_exact":27,"villager_cleric_visible_diffs":cleric_visible_diffs,"dragon_base_exact":1,"dragon_exploding_uv_mask_exact":True,"arrow_max_channel_delta":arrow_delta,"structural_visible_exact":15,"grass_colormap_exact":True,"bush_max_channel_delta":bush_delta,"water_alpha_contract":water_alpha,"lava_flow_exact":True,"lava_still_shared_exact_frames":19,"lava_still_java_frames":lava_still.height//16,"lava_still_bedrock_frames":lava_still_ref.height//16,"chest_diff_pixels":chest_diff_pixels,"copper_top_inner_exact":copper_top_inner_exact}}))
          PY
      - name: Build entity UV review boards
        if: always()
        run: |
          if [ -f build/java26_3-to-bedrock1_26_50_4.mcpack ]; then
            python3 scripts/build-uv-review.py \
              --mcpack build/java26_3-to-bedrock1_26_50_4.mcpack \
              --java-root java-vanilla/assets/minecraft/textures \
              --bedrock-root bedrock-vanilla/resource_pack/textures \
              --out build/uv-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: converted-java26-3-bedrock-pack
          path: |
            build/java_26_3_vanilla.zip
            build/java26_3-to-bedrock1_26_50_4.mcpack
            build/conversion.log
            build/uv-review
          if-no-files-found: warn
          retention-days: 7
